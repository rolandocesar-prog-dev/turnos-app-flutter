name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test --coverage

  rules:
    name: Reglas de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: npm ci

      - name: Pruebas de reglas en el emulador
        run: npm run test:rules
