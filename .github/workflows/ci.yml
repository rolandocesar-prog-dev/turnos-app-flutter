name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test --coverage

  rules:
    name: Reglas y Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: |
          npm ci
          npm ci --prefix functions

      - name: Pruebas de reglas en el emulador
        run: npm run test:rules

      - name: Tipos y pruebas unitarias de las funciones
        run: |
          npm --prefix functions run typecheck
          npm --prefix functions test

      - name: Funciones en el emulador
        run: npm run test:functions

  integration:
    name: Integración (reservar → cancelar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependencias
        run: |
          npm ci
          flutter pub get

      # El runner trae Chrome y su chromedriver (CHROMEWEBDRIVER).
      - name: Iniciar chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 2

      - name: Prueba de integración en Chrome contra los emuladores
        run: npm run test:e2e
